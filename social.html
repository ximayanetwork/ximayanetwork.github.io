```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XIMAYA Social</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
      color: #171717;
    }

    header {
      background: #111;
      color: #fff;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 25px;
    }

    .wrap {
      max-width: 650px;
      margin: auto;
      padding: 20px 14px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07);
    }

    h2, h3 { margin-top: 0; }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin: 6px 0;
      font-size: 15px;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      margin-top: 7px;
      background: #111;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    .logout {
      background: #777;
    }

    .post {
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 15px;
    }

    .member {
      font-size: 13px;
      color: #777;
      margin-bottom: 7px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .actions button {
      width: auto;
      padding: 8px 14px;
      background: #f0f0f0;
      color: #111;
    }

    .comment {
      background: #f3f3f3;
      padding: 9px 11px;
      border-radius: 9px;
      margin-top: 7px;
      font-size: 14px;
    }

    #socialApp {
      display: none;
    }

    #status {
      text-align: center;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

<header>
  <h1>🌍 XIMAYA Social</h1>
</header>

<div class="wrap">

  <div id="status"></div>

  <!-- LOGIN / JOIN -->
  <div id="authCard" class="card">
    <h2>Join XIMAYA</h2>

    <input
      id="email"
      type="email"
      placeholder="Email address"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button onclick="createAccount()">Create Account</button>
    <button onclick="login()">Sign In</button>
  </div>

  <!-- SOCIAL APP -->
  <div id="socialApp">

    <div class="card">
      <div id="currentUser"></div>
      <button class="logout" onclick="logout()">Sign Out</button>
    </div>

    <div class="card">
      <h3>Create a post</h3>

      <textarea
        id="postContent"
        placeholder="What's happening on XIMAYA?"
      ></textarea>

      <button onclick="publishPost()">Publish</button>
    </div>

    <div class="card">
      <h3>Social Feed</h3>
      <div id="feed">Loading...</div>
    </div>

  </div>

</div>

<script>
  /* =========================
     XIMAYA SUPABASE
     ========================= */

  const SUPABASE_URL =
    "https://bbzuzkgcyzslfyhpyczo.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_lpbVQhvINUjxHJcHySN7Lg_AOBoFurG";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================
     HELPERS
     ========================= */

  function status(text) {
    document.getElementById("status").textContent = text;
  }

  function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value || "";
    return div.innerHTML;
  }


  /* =========================
     ACCOUNT
     ========================= */

  async function createAccount() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      status("Enter your email and password.");
      return;
    }

    if (password.length < 6) {
      status("Password must be at least 6 characters.");
      return;
    }

    status("Creating your XIMAYA account...");

    const { data, error } =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (error) {
      status(error.message);
      return;
    }

    if (data.session) {
      status("Account created successfully.");
      showApp(data.session.user);
      loadFeed();
    } else {
      status(
        "Account created. Check your email if confirmation is required."
      );
    }
  }


  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    if (!email || !password) {
      status("Enter your email and password.");
      return;
    }

    status("Signing in...");

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      status(error.message);
      return;
    }

    showApp(data.user);
    status("Signed in successfully.");
    loadFeed();
  }


  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("authCard").style.display = "block";
    document.getElementById("socialApp").style.display = "none";

    status("Signed out.");
  }


  function showApp(user) {

    document.getElementById("authCard").style.display = "none";
    document.getElementById("socialApp").style.display = "block";

    document.getElementById("currentUser").textContent =
      "Signed in as " + user.email;
  }


  /* =========================
     POSTS
     ========================= */

  async function publishPost() {

    const content =
      document.getElementById("postContent").value.trim();

    if (!content) {
      status("Write something before publishing.");
      return;
    }

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      status("Please sign in first.");
      return;
    }

    status("Publishing...");

    const { error } =
      await supabaseClient
        .from("posts")
        .insert({
          user_id: user.id,
          content: content
        });

    if (error) {
      console.error(error);
      status("Post error: " + error.message);
      return;
    }

    document.getElementById("postContent").value = "";

    status("Post published successfully.");
    loadFeed();
  }


  async function loadFeed() {

    const feed =
      document.getElementById("feed");

    feed.innerHTML = "Loading...";

    const { data, error } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at", {
          ascending: false
        });

    if (error) {
      console.error(error);
      feed.innerHTML =
        "<p>Could not load posts.</p>";
      return;
    }

    if (!data || data.length === 0) {
      feed.innerHTML =
        "<p>No posts yet. Be the first to post.</p>";
      return;
    }

    feed.innerHTML = "";

    for (const post of data) {

      const article =
        document.createElement("div");

      article.className = "post";

      article.innerHTML = `
        <div class="member">
          XIMAYA Member
        </div>

        <div>
          ${escapeHTML(post.content)}
        </div>

        <div class="actions">
          <button onclick="likePost('${post.id}')">
            ❤️ Like
          </button>
        </div>

        <div id="comments-${post.id}">
          Loading comments...
        </div>

        <input
          id="commentInput-${post.id}"
          placeholder="Write a comment..."
        >

        <button onclick="addComment('${post.id}')">
          Comment
        </button>
      `;

      feed.appendChild(article);

      loadComments(post.id);
    }
  }


  /* =========================
     LIKES
     ========================= */

  async function likePost(postId) {

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      status("Please sign in first.");
      return;
    }

    const { error } =
      await supabaseClient
        .from("likes")
        .insert({
          post_id: postId,
          user_id: user.id
        });

    if (error) {

      if (error.code === "23505") {
        status("You already liked this post.");
      } else {
        status("Like error: " + error.message);
      }

      return;
    }

    status("Liked ❤️");
  }


  /* =========================
     COMMENTS
     ========================= */

  async function addComment(postId) {

    const input =
      document.getElementById(
        "commentInput-" + postId
      );

    const content =
      input.value.trim();

    if (!content) {
      return;
    }

    const {
      data: { user }
    } = await supabaseClient.auth.getUser();

    if (!user) {
      status("Please sign in first.");
      return;
    }

    const { error } =
      await supabaseClient
        .from("comments")
        .insert({
          post_id: postId,
          user_id: user.id,
          content: content
        });

    if (error) {
      status("Comment error: " + error.message);
      return;
    }

    input.value = "";

    status("Comment added.");
    loadComments(postId);
  }


  async function loadComments(postId) {

    const box =
      document.getElementById(
        "comments-" + postId
      );

    if (!box) return;

    const { data, error } =
      await supabaseClient
        .from("comments")
        .select("*")
        .eq("post_id", postId)
        .order("created_at", {
          ascending: true
        });

    if (error) {
      box.innerHTML = "";
      return;
    }

    box.innerHTML = "";

    if (!data || data.length === 0) {
      return;
    }

    data.forEach(comment => {

      const div =
        document.createElement("div");

      div.className = "comment";

      div.textContent =
        comment.content;

      box.appendChild(div);
    });
  }


  /* =========================
     SESSION
     ========================= */

  async function checkSession() {

    const {
      data: { session }
    } = await supabaseClient.auth.getSession();

    if (session && session.user) {
      showApp(session.user);
      loadFeed();
    }
  }


  supabaseClient.auth.onAuthStateChange(
    (event, session) => {

      if (session && session.user) {
        showApp(session.user);
        loadFeed();
      }
    }
  );


  checkSession();
</script>

</body>
</html>
